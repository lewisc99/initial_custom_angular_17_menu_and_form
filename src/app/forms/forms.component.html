<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Custom Forms</mat-card-title>
    <mat-card-subtitle>Custom Forms subtitle</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" *ngIf="formGroup">
      <div class="row">
        <div class="col-lg-4">
          <input-text label="Name" formControlName="name" [maxLength]="40">
          </input-text>
        </div>
        <div class="col-lg-4">
          <input-text
            label="Net Worth"
            formControlName="netWorth"
            mask="currency"
            [required]="true"
          >
          </input-text>
        </div>

        <div class="col-lg-4">
          <input-text label="Placa" formControlName="placa" mask="placa">
          </input-text>
        </div>

        <div class="col-lg-4">
          <input-text label="Cnpj" formControlName="cnpj" mask="cnpj">
          </input-text>
        </div>

        <div class="col-lg-4">
          <input-text label="Cnpj" formControlName="cnpj" mask="cnpj">
          </input-text>
        </div>

        <div class="col-lg-4">
          <input-text
            label="Percentage"
            formControlName="percentage"
            mask="number-with-dot"
            prefix="%"
          >
          </input-text>
        </div>

        <div class="col-lg-4">
          <input-text
            label="Call Blur method"
            formControlName="callBlurMethod"
            (blur)="onBlur()"
          >
          </input-text>
        </div>

        <div class="col-lg-4">
          {{ blurValue }}
        </div>

        <div class="col-lg-4">
          <input-text
            label="Call Change method"
            formControlName="callChangeMethod"
            (change)="onChange()"
          >
          </input-text>
        </div>
        <div class="col-lg-4">
          {{ changeValue }}
        </div>

        <div class="col-lg-4">
          <input-text
            formControlName="requireByTemplate"
            [required]="true"
            placeholder="Require By Template"
            label="Require By Template"
          >
          </input-text>
        </div>
        <div class="col-lg-4">
          <input-text
            formControlName="requireByFormGroup"
            [required]="true"
            placeholder="Require By Form Group"
            label="Require By Form Group"
          >
          </input-text>
        </div>

        <div class="col-lg-4">
          <input-text
            formControlName="disabledByTemplate"
            placeholder="Disabled By Template"
            label="Disabled By Template"
            [disabled]="true"
          >
          </input-text>
        </div>

        <div class="col-lg-4">
          <input-text
            formControlName="disabledByFormGroup"
            placeholder="Disabled By FormGroup"
            label="Disabled By FormGroup"
          >
          </input-text>
        </div>

        <div class="col-lg-4">
          <input-text
            formControlName="maxLengthExample"
            placeholder="Max Length Example"
            label="Max Length Example"
            [maxLength]="10"
          >
          </input-text>
        </div>
        <div class="col-lg-4">
          <input-text
            formControlName="minLengthExample"
            placeholder="Min Length Example"
            label="Min Length Example"
            [minLength]="5"
          >
          </input-text>
        </div>

        <div class="col-lg-4">
          <input-text
          label="Min and Max Length"
          formControlName="minAndMaxLengthExample"
          [minLength]="5"
          [maxLength]="15"
        >
          </input-text>
        </div>
      </div>
    </form>
  </mat-card-content>
  <mat-card-actions> </mat-card-actions>
</mat-card>
